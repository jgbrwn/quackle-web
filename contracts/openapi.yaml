openapi: 3.1.0
info:
  title: Quackle Web HTTP API
  version: 0.3.0
  description: Public session and analysis contract for hosted Quackle Web-compatible services.
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      operationId: getMeta
      responses:
        "200":
          description: Build, capability, board, engine, and default lexicon metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
  /moves/generate:
    post:
      operationId: generateMovesStatelessLegacy
      description: >-
        Legacy anonymous stateless fast-generation route, using the default
        fast pool, retained for compatibility. It does not read session state.
        New browser clients should use the session-scoped generation operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol, id, op, deadline_ms, seed, payload]
              properties:
                protocol: { const: 1 }
                id: { type: string, minLength: 1, maxLength: 128 }
                op: { const: generate_moves }
                deadline_ms: { type: integer, minimum: 1, maximum: 60000 }
                seed: { type: integer, minimum: 0, maximum: 4294967295 }
                payload: { type: object }
              additionalProperties: false
      responses:
        "200":
          description: Versioned native result event.
          content:
            application/json:
              schema:
                { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
        "400":
          description: Invalid protocol request; response uses the native worker event envelope.
          content:
            application/json:
              schema:
                { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
        "405": { description: Method is not allowed. }
        "413":
          description: Request exceeds the Go supervisor's configured body limit.
          content:
            application/json:
              schema:
                { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
        "415": { description: Content-Type must be application/json. }
        "422":
          description: Position or engine request is invalid.
          content:
            application/json:
              schema:
                { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Compute unavailable or admission control unavailable.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
                  - { $ref: "#/components/schemas/Error" }
        "504":
          description: Native request deadline exceeded.
          content:
            application/json:
              schema:
                { $ref: "./worker-protocol.schema.json#/$defs/workerEvent" }
  /imports/gcg:
    post:
      operationId: validateGcgImport
      description: Validate uploaded GCG bytes (text/plain or application/octet-stream, at most 256 KiB).
      responses:
        "200":
          {
            description: "Parsed document, encoding, sourceSha256, and lexicon resolution.",
          }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          {
            description: Content-Type must be text/plain or application/octet-stream.,
          }
        "422": { description: GCG could not be parsed. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /imports/cross-tables:
    post:
      operationId: importCrossTablesGame
      description: >-
        Fetch one allowlisted Cross-Tables annotated game and its matching GCG
        download server-side (Cross-Tables sends no CORS headers), then validate
        it like an upload. The page's declared dictionary is used when the GCG
        has no #lexicon pragma. Input must use an exact HTTPS hostname of
        cross-tables.com or www.cross-tables.com, without encoded host aliases,
        URL credentials, or a nondefault port; explicit port 443 is accepted
        and canonicalized away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  {
                    type: string,
                    description: "HTTPS Cross-Tables annotated.php URL with one numeric u game id; no credentials or nondefault port.",
                  }
      responses:
        "200":
          {
            description: "Validated document plus gameId, sourceUrl, gcgUrl, gcgBase64, and lexicon {status, source, hint, id}.",
          }
        "404": { description: Game or GCG file not found. }
        "413":
          { description: The fetched GCG exceeds the configured import limit. }
        "415": { description: Content-Type must be application/json. }
        "422":
          {
            description: "URL is not an allowlisted annotated-game link, or GCG is invalid.",
          }
        "502": { description: Cross-Tables could not be reached. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions:
    post:
      operationId: createSession
      responses:
        "201":
          description: Session created; implementation also sets an HttpOnly capability cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      responses:
        "200":
          description: Canonical session without waking native compute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, state]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                state: { $ref: "#/components/schemas/SessionState" }
              additionalProperties: false
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/share:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionShareLinks
      description: List safe share-link metadata (including each immutable recipient-visible label) and undismissed automatic-eviction notices. Never returns bearer tokens or URLs.
      responses:
        "200":
          description: Active links with immutable display labels and notices for this authorized source session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCollection" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createSessionShareLink
      description: Create an immutable snapshot-fork link. The optional shareLabel is visible to link recipients and stored alongside this link's immutable state snapshot; later local scenario renames do not change it. The bearer token is returned only once; store/copy the URL if it must be retained.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shareLabel:
                  type: string
                  maxLength: 128
                  description: Recipient-visible label captured immutably alongside this share link's state snapshot (limited to 128 UTF-8 bytes).
              additionalProperties: false
      responses:
        "201":
          description: New link metadata, captured recipient-visible label, and one-time bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          { description: Per-session share snapshot storage limit reached. }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/share/{shareId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: shareId
        in: path
        required: true
        schema: { type: string, minLength: 20, maxLength: 128 }
    delete:
      operationId: revokeSessionShareLink
      description: Revoke future redemption and delete the stored snapshot; already-created recipient forks remain independent.
      responses:
        "200": { description: Link revoked. }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/share-notices/{shareId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: shareId
        in: path
        required: true
        schema: { type: string, minLength: 20, maxLength: 128 }
    delete:
      operationId: dismissShareEvictionNotice
      responses:
        "200": { description: Notice dismissed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /shares/redeem:
    post:
      operationId: redeemShareLink
      description: Redeem a fragment bearer token. Creates a new independent session and sets its HttpOnly capability cookie; returns the immutable recipient-visible shareLabel separately from canonical session state and never returns source-session authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSessionId, token]
              properties:
                sourceSessionId: { type: string, minLength: 20, maxLength: 128 }
                token: { type: string, minLength: 32, maxLength: 256 }
              additionalProperties: false
      responses:
        "201":
          description: New independent fork session and optional shareLabel; capability is delivered in an HttpOnly cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareRedeemed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/moves/generate:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: generateMoves
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionRevision, options]
              properties:
                sessionRevision: { type: integer, minimum: 0 }
                options: { $ref: "#/components/schemas/GenerateOptions" }
              additionalProperties: false
      responses:
        "200":
          description: Ranked static moves from warm or cold native compute.
          content:
            application/json:
              schema:
                type: object
                required: [identity, moves]
                properties:
                  identity: { $ref: "#/components/schemas/ResultIdentity" }
                  moves:
                    type: array
                    items: { $ref: "#/components/schemas/Move" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Deadline" }
  /sessions/{sessionId}/analysis/jobs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createAnalysisJob
      description: >-
        Idempotency-Key deduplicates equivalent job requests for 24 hours after
        creation and remains associated with a job while it is in progress.
        Reusing the same key with different options during that period returns
        a conflict. The sessionRevision must still match current session state;
        stale-revision requests return a conflict before idempotency replay.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionRevision, options]
              properties:
                sessionRevision: { type: integer, minimum: 0 }
                options: { $ref: "#/components/schemas/AnalysisOptions" }
              additionalProperties: false
      responses:
        "202":
          description: Persisted job accepted for dispatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/analysis/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getAnalysisJob
      responses:
        "200":
          description: Authoritative persisted job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: cancelAnalysisJob
      responses:
        "200":
          description: Idempotently cancelled or existing terminal job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/analysis/jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: retryAnalysisJob
      description: Requeue an interrupted or retryable failed job using its stored canonical request.
      responses:
        "202":
          description: Job requeued for another bounded attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: connectSessionEvents
      description: >-
        WebSocket upgrade for session events. The browser Origin must match
        this API origin (or an explicitly configured origin); sync messages
        are limited to 1 KiB and oversized messages close with code 1009. Event
        replay is bounded to the latest 100 contiguous events; when the cursor
        is stale, future, or crosses a missing sequence, the server sends a
        current session snapshot instead of a partial replay. Job state remains
        authoritative through the HTTP job endpoints.
      responses:
        "101": { description: Switching Protocols }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sessions/{sessionId}/lexicons:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: uploadLexicon
      description: Upload strict UTF-8 one-word-per-line text. Server normalizes and hashes authoritatively.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 5242880
      responses:
        "202":
          description: Existing verified artifact reused or build accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LexiconEnvelope" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sessions/{sessionId}/lexicons/{lexiconId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: lexiconId
        in: path
        required: true
        schema: { type: string, minLength: 8, maxLength: 128 }
    get:
      operationId: getLexicon
      responses:
        "200":
          description: Authorized manifest/build status; never raw words or artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LexiconEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 128 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 128 }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Domain-invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Request Origin is not allowed for this session operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Revision, idempotency, or compatibility conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found or not authorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Body/list exceeds configured limits.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate, quota, or concurrency limit.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Compute unavailable, saturated, or admission control unavailable.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Deadline:
      description: Compute deadline exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Meta:
      type: object
      required: [apiVersion, capabilities, defaultLexicon]
      properties:
        apiVersion: { const: 1 }
        capabilities: { type: object, additionalProperties: true }
        defaultLexicon: { $ref: "#/components/schemas/Lexicon" }
      additionalProperties: true
    SessionEnvelope:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/Session" }
      additionalProperties: false
    ShareLink:
      type: object
      required:
        [
          shareId,
          sourceRevision,
          createdAt,
          expiresAt,
          useCount,
          lastUsedAt,
          shareLabel,
        ]
      properties:
        shareId: { type: string, minLength: 20, maxLength: 128 }
        sourceRevision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        useCount: { type: integer, minimum: 0 }
        lastUsedAt: { type: [string, "null"], format: date-time }
        shareLabel: { type: [string, "null"], maxLength: 128 }
      additionalProperties: false
    ShareCollection:
      type: object
      required: [shares, notices]
      properties:
        shares:
          { type: array, items: { $ref: "#/components/schemas/ShareLink" } }
        notices: { type: array, items: { type: object } }
      additionalProperties: false
    ShareCreated:
      type: object
      required: [share]
      properties:
        share:
          type: object
          required:
            [
              shareId,
              sourceSessionId,
              sourceRevision,
              token,
              expiresAt,
              lifetime,
              shareLabel,
            ]
          properties:
            shareId: { type: string, minLength: 20, maxLength: 128 }
            sourceSessionId: { type: string, minLength: 20, maxLength: 128 }
            sourceRevision: { type: integer, minimum: 0 }
            token: { type: string, minLength: 32, maxLength: 256 }
            expiresAt: { type: "null" }
            lifetime: { const: until_revoked }
            shareLabel: { type: [string, "null"], maxLength: 128 }
          additionalProperties: false
      additionalProperties: false
    ShareRedeemed:
      type: object
      required: [session, shareLabel]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        shareLabel: { type: [string, "null"], maxLength: 128 }
      additionalProperties: false
    Session:
      type: object
      required: [version, id, revision, state, createdAt, updatedAt]
      properties:
        version: { const: 1 }
        id: { type: string }
        revision: { type: integer, minimum: 0 }
        state: { $ref: "#/components/schemas/SessionState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    SessionState:
      type: object
      required: [position, lexiconId, boardId]
      properties:
        position: { $ref: "#/components/schemas/Position" }
        lexiconId: { type: string, maxLength: 128 }
        boardId: { const: classic15 }
        history: { type: array, items: { type: object } }
        analysisPreferences: { type: object }
      additionalProperties: false
    Position:
      type: object
      required: [version, board, rack, scores, turn, unseen]
      properties:
        version: { const: 1 }
        board:
          type: object
          required: [id, cells]
          properties:
            id: { const: classic15 }
            cells:
              type: array
              maxItems: 225
              items:
                type: object
                required: [row, col, letter, blank]
                properties:
                  row: { type: integer, minimum: 0, maximum: 14 }
                  col: { type: integer, minimum: 0, maximum: 14 }
                  letter: { type: string, pattern: "^[A-Z]$" }
                  blank: { type: boolean }
                additionalProperties: false
          additionalProperties: false
        rack: { type: string, pattern: "^[A-Z?]{0,7}$" }
        scores:
          type: object
          required: [onTurn, opponent]
          properties:
            onTurn: { type: integer, minimum: 0 }
            opponent: { type: integer, minimum: 0 }
          additionalProperties: false
        turn:
          type: object
          required: [number, scorelessTurns]
          properties:
            number: { type: integer, minimum: 1 }
            scorelessTurns: { type: integer, minimum: 0, maximum: 6 }
          additionalProperties: false
        unseen: { type: object }
      additionalProperties: false
    GenerateOptions:
      type: object
      properties:
        candidateLimit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        deadlineMs:
          { type: integer, minimum: 100, maximum: 5000, default: 2000 }
        includeExchanges: { type: boolean, default: true }
        seed:
          { type: integer, minimum: 0, maximum: 4294967295, default: 123456789 }
      additionalProperties: false
    AnalysisOptions:
      type: object
      required: [budgetMs, candidateLimit]
      properties:
        budgetMs: { type: integer, minimum: 1000, maximum: 60000 }
        candidateLimit: { type: integer, minimum: 1, maximum: 50 }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
      additionalProperties: false
    Move:
      type: object
      required: [id, action, rank]
      properties:
        id: { type: string }
        action: { enum: [place, exchange, pass] }
        rank: { type: integer, minimum: 1 }
        score: { type: integer }
        equity: { type: [number, "null"] }
        word: { type: string }
      additionalProperties: true
    ResultIdentity:
      type: object
      required:
        [sessionRevision, engineId, protocol, lexiconId, positionHash, seed]
      properties:
        sessionRevision: { type: integer }
        engineId: { type: string }
        protocol: { type: integer }
        lexiconId: { type: string }
        positionHash: { type: string }
        seed: { type: integer }
        coldStart: { type: boolean }
      additionalProperties: false
    JobEnvelope:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }
      additionalProperties: false
    Job:
      type: object
      required:
        [
          id,
          sessionRevision,
          status,
          attempt,
          progressSeq,
          progress,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        sessionRevision: { type: integer }
        attempt: { type: integer, minimum: 1 }
        progressSeq: { type: integer, minimum: 0 }
        progress: { oneOf: [{ type: object }, { type: "null" }] }
        status:
          enum:
            [
              queued,
              starting,
              running,
              succeeded,
              failed,
              cancelled,
              interrupted,
            ]
        identity:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/ResultIdentity" },
                { type: "null" },
              ],
          }
        result: { type: [object, "null"] }
        error:
          { oneOf: [{ $ref: "#/components/schemas/Error" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    LexiconEnvelope:
      type: object
      required: [lexicon]
      properties:
        lexicon: { $ref: "#/components/schemas/Lexicon" }
      additionalProperties: false
    Lexicon:
      type: object
      required: [id, displayName, status, sourceKind, strategyCompatibility]
      properties:
        id: { type: string }
        displayName: { type: string, maxLength: 80 }
        status: { enum: [building, ready, failed, expired] }
        sourceKind: { enum: [default, visitor_upload] }
        wordCount: { type: [integer, "null"] }
        strategyCompatibility: { enum: [reviewed, generic, none] }
        error:
          { oneOf: [{ $ref: "#/components/schemas/Error" }, { type: "null" }] }
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId]
          properties:
            code: { type: string, pattern: "^[a-z0-9_]+$" }
            message: { type: string, maxLength: 1024 }
            retryable: { type: boolean }
            requestId: { type: string }
            details: { type: object }
          additionalProperties: false
      additionalProperties: false
